<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMIDAS</title>
  <link rel="stylesheet" href="css/comida.css">
</head>

<body>
  <header>
    <h1>Comidas</h1>
  </header>

  <div class="container">
    <nav>
      <a href="index.html">Menu principal</a>
    </nav>

    <form id="formDoacao">
      <label>Nome completo:</label>
      <input type="text" id="nome" placeholder="Insira nome">
      <br>
      <label>Número para contato:</label>
      <input type="text" id="contato" placeholder="Contato">
      <br>
      
      <label>Cuscuz de milho(nordestino)<input type="checkbox" id="checkbox1"></label>
      
      <label>Cuscuz paulista<input type="checkbox" id="checkbox2"> </label>
      
      <label>Cuscuz marroquino( Árabe original)<input type="checkbox" id="checkbox3"></label>
      
      <label>Cuscuz de arroz ou tapioca <input type="checkbox" id="checkbox4"></label>
      <br>
      <button type="submit">Fazer pedido</button>
    </form>
  </div>

  <!-- Apenas um script chamando o JS -->
  <script type="module" src="script.js" defer></script>
</body>

</html>
